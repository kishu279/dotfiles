[font]
size = 12.0

[font.normal]
# family = "DepartureMono Nerd Font Mono"
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"



[window]
startup_mode = "Maximized"
decorations = "None"
opacity = 0.8

[window.padding]
x = 15
y = 15

[selection]
save_to_clipboard = true

[terminal]

[terminal.shell]
program = "/usr/bin/zellij"


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
